name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retro_ci
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: retro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retro_ci -d retro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Lint and SQLite tests
        run: |
          python -m ruff check server tests migrations scripts
          python -m pytest -q
      - name: PostgreSQL migration and tests
        env:
          DATABASE_URL: postgresql://retro_ci:ci-only-local@localhost:5432/retro_ci
          TEST_POSTGRES_URL: postgresql://retro_ci:ci-only-local@localhost:5432/retro_ci
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest -q
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Build and smoke test production container
        run: |
          docker build -t code-retro:ci .
          docker run -d --name code-retro-ci --network host \
            -e DATABASE_URL=postgresql://retro_ci:ci-only-local@localhost:5432/retro_ci \
            -e PUBLIC_BASE_URL=https://code-retro.example \
            -e AI_ENABLED=false -e PORT=8000 code-retro:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root">'
              exit 0
            fi
            sleep 3
          done
          docker logs code-retro-ci
          exit 1
